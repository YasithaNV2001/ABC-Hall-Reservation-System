name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile sources
        run: |
          find src -name '*.java' > sources.txt
          javac --release 19 -encoding UTF-8 -cp "lib/*" -d build/classes @sources.txt
